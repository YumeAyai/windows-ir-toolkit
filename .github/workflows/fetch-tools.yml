name: Fetch Forensics Tools

on:
  # 每周日 02:00 UTC 自动检查更新 (北京时间 10:00)
  schedule:
    - cron: '0 2 * * 0'
  # 支持手动触发
  workflow_dispatch:
    inputs:
      force:
        description: '强制更新(即使没新版本也重新打包)'
        required: false
        default: 'false'
        type: boolean
  # 当 fetch-tools 相关文件变更时也触发
  push:
    paths:
      - '.github/workflows/fetch-tools.yml'
      - 'tools-manifest.json'

permissions:
  contents: write   # 用来创建 release
  actions: read

jobs:
  validate-windows:
    name: Validate Windows entry points
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse PowerShell scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failures = @()
          Get-ChildItem -Path . -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($error in $errors) { $failures += "$($_.FullName): $($error.Message)" }
          }
          if ($failures.Count -gt 0) { throw ($failures -join "`n") }
          Write-Host "PowerShell 5.1 parse check passed"

      - name: Reject wildcard use with LiteralPath
        shell: powershell
        run: |
          $failures = @()
          Get-ChildItem -Path . -Recurse -Filter *.ps1 | ForEach-Object {
            $content = Get-Content -Raw -LiteralPath $_.FullName
            if ($content -match '(?im)\b(?:Copy-Item|Get-ChildItem|Test-Path)\s+-LiteralPath\s+(?:"[^"]*[\*\?][^"]*"|''[^'']*[\*\?][^'']*''|[^\s]*[\*\?][^\s]*)') {
              $failures += "$($_.FullName): wildcard passed to -LiteralPath"
            }
          }
          if ($failures.Count -gt 0) { throw ($failures -join "`n") }
          Write-Host "LiteralPath wildcard regression check passed"

      - name: Verify signed Go WinPmem CLI
        shell: powershell
        run: |
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/Velocidex/WinPmem/releases/latest'
          $asset = $release.assets | Where-Object name -eq 'go-winpmem_amd64_1.0-rc2_signed.exe' | Select-Object -First 1
          if (-not $asset) { throw 'Signed production Go WinPmem asset not found' }
          $exe = "$env:RUNNER_TEMP\go-winpmem.exe"
          $helpFile = "$env:RUNNER_TEMP\go-winpmem-help.txt"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $exe -UseBasicParsing
          & cmd.exe /d /c "`"$exe`" --help > `"$helpFile`" 2>&1"
          $help = Get-Content -Raw -LiteralPath $helpFile
          if ($help -notmatch 'acquire') { throw "Go WinPmem CLI does not expose the acquire command. Output: $help" }
          Write-Host "Signed Go WinPmem acquire command verified"

  fetch:
    name: Download tools & publish release
    needs: validate-windows
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python (用于解析 JSON)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Windows script encodings
        run: |
          python3 -c 'from pathlib import Path; files=list(Path(".").rglob("*.ps1")); bad=[str(p) for p in files if not (p.read_bytes().startswith(b"\xef\xbb\xbf") and b"\n" not in p.read_bytes().replace(b"\r\n", b""))]; assert not bad, "PowerShell scripts must be UTF-8 BOM + CRLF: " + ", ".join(bad)'
          python3 - <<'PY'
          from pathlib import Path
          bad = []
          for path in Path('.').rglob('*.bat'):
              data = path.read_bytes()
              try:
                  data.decode('gbk')
              except UnicodeDecodeError:
                  bad.append(f'{path} (not GBK)')
              if b'\n' in data.replace(b'\r\n', b''):
                  bad.append(f'{path} (not CRLF)')
          assert not bad, 'Batch scripts must use GBK + CRLF: ' + ', '.join(bad)
          PY
          echo "✓ PowerShell UTF-8 BOM/CRLF and batch GBK/CRLF validated"

      - name: Load manifest
        id: manifest
        run: |
          python3 -c "import json; m = json.load(open('tools-manifest.json')); print(json.dumps(m, indent=2))"
          echo "manifest<<EOF" >> $GITHUB_OUTPUT
          cat tools-manifest.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Resolve latest WinPmem
        id: winpmem
        run: |
          echo "Querying Velocidex/WinPmem latest release..."
          WINPMEM_JSON=$(curl -fsSL "https://api.github.com/repos/Velocidex/WinPmem/releases/latest")
          WINPMEM_TAG=$(echo "$WINPMEM_JSON" | jq -r '.tag_name // empty')
          WINPMEM_ASSET="go-winpmem_amd64_1.0-rc2_signed.exe"
          WINPMEM_URL=$(echo "$WINPMEM_JSON" | jq -r --arg asset "$WINPMEM_ASSET" '.assets[] | select(.name == $asset) | .browser_download_url' 2>/dev/null)
          echo "DEBUG: WINPMEM_URL='$WINPMEM_URL' (len=${#WINPMEM_URL})"
          if [ -z "$WINPMEM_URL" ] || [ "$WINPMEM_URL" = "null" ]; then
            echo "::error::Cannot find signed production asset $WINPMEM_ASSET in latest release"
            echo "DEBUG: First 800 chars of API response:"
            echo "$WINPMEM_JSON" | head -c 800
            echo ""
            echo "DEBUG: Available assets:"
            echo "$WINPMEM_JSON" | jq -r '.assets[].name // empty' 2>/dev/null || echo "(no assets array)"
            exit 1
          fi
          echo "tag=$WINPMEM_TAG" >> $GITHUB_OUTPUT
          echo "asset=$WINPMEM_ASSET" >> $GITHUB_OUTPUT
          echo "url=$WINPMEM_URL" >> $GITHUB_OUTPUT
          echo "✓ WinPmem $WINPMEM_TAG / $WINPMEM_ASSET"

      - name: Resolve latest capa
        id: capa
        run: |
          echo "Querying mandiant/capa latest release..."
          CAPA_JSON=$(curl -fsSL "https://api.github.com/repos/mandiant/capa/releases/latest")
          CAPA_TAG=$(echo "$CAPA_JSON" | jq -r '.tag_name // empty')
          CAPA_URL=$(echo "$CAPA_JSON" | jq -r --arg tag "$CAPA_TAG" '
            (.assets[] | select(.name == ("capa-\($tag)-windows.zip")) | .browser_download_url) //
            (.assets[] | select((.name | test("windows"; "i")) and (.name | test("\\.zip$"))) | .browser_download_url)
          ' 2>/dev/null)
          echo "DEBUG: CAPA_URL='$CAPA_URL' (len=${#CAPA_URL})"
          if [ -z "$CAPA_URL" ] || [ "$CAPA_URL" = "null" ]; then
            echo "::error::Cannot find capa windows zip in latest release"
            echo "DEBUG: First 800 chars of API response:"
            echo "$CAPA_JSON" | head -c 800
            echo ""
            echo "DEBUG: Available assets:"
            echo "$CAPA_JSON" | jq -r '.assets[].name // empty' 2>/dev/null || echo "(no assets array)"
            exit 1
          fi
          echo "tag=$CAPA_TAG" >> $GITHUB_OUTPUT
          echo "url=$CAPA_URL" >> $GITHUB_OUTPUT
          echo "✓ capa $CAPA_TAG"

      - name: Check existing release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 看现有的 tools-* release
          EXISTING_TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[] | select(.tagName | startswith("tools-"))' 2>/dev/null | head -1 || echo "")
          echo "existing_tag=$EXISTING_TAG" >> $GITHUB_OUTPUT

          # 对比 winpmem tag 是否变化
          if [ -n "$EXISTING_TAG" ] && [ "$EXISTING_TAG" = "tools-${{ steps.winpmem.outputs.tag }}-${{ steps.capa.outputs.tag }}" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "✓ No changes, existing release matches: $EXISTING_TAG"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "→ Changes detected, will publish new release"
          fi

      - name: Download WinPmem
        if: steps.check.outputs.changed == 'true'
        run: |
          mkdir -p 01_collection/tools
          echo "Downloading ${{ steps.winpmem.outputs.url }}..."
          curl -fsSL --retry 3 --retry-delay 5 -o "01_collection/tools/${{ steps.winpmem.outputs.asset }}" "${{ steps.winpmem.outputs.url }}"
          ls -la 01_collection/tools/
          file "01_collection/tools/${{ steps.winpmem.outputs.asset }}" 2>/dev/null || true

      - name: Download capa
        if: steps.check.outputs.changed == 'true'
        run: |
          mkdir -p 02_analysis/tools
          echo "Downloading ${{ steps.capa.outputs.url }}..."
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/capa.zip "${{ steps.capa.outputs.url }}"
          # 展开 zip,但只保留 windows-x64 的可执行文件
          cd 02_analysis/tools
          unzip -o /tmp/capa.zip
          rm -f /tmp/capa.zip
          # 找到主程序,简化命名
          find . -name "capa.exe" -type f | head -1
          ls -la

      - name: Download Sysmon
        if: steps.check.outputs.changed == 'true'
        run: |
          # Sysmon 不是 GitHub release,直接 curl
          mkdir -p 01_collection/sysmon
          echo "Downloading Sysmon from Microsoft..."
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/Sysmon.zip "https://download.sysinternals.com/files/Sysmon.zip"
          cd 01_collection/sysmon
          unzip -o /tmp/Sysmon.zip
          rm -f /tmp/Sysmon.zip
          # 保留 Sysmon64.exe (主程序) 和 Eula.txt
          ls -la

      - name: Download Volatility 3
        if: steps.check.outputs.changed == 'true'
        run: |
          # vol3 是纯 Python 包；下载 Windows 目标环境的 wheel，不能直接
          # 把 Linux runner 上的 Python site-packages 塞进 Windows 包。
          mkdir -p 02_analysis/volatility3
          echo "Downloading Volatility 3 wheel via pip..."
          python3 -m pip download \
            --dest 02_analysis/volatility3 \
            --only-binary=:all: \
            --platform win_amd64 \
            --implementation cp \
            --python-version 3.12 \
            volatility3
          # 不预打包整套 Windows symbols（体积可达 GB 级）。Volatility 自己
          # 管理 symbols 缓存，缺少的 Windows symbols 在分析时按需解析。
          ls -la 02_analysis/volatility3/

      - name: Download Python embeddable (Windows)
        if: steps.check.outputs.changed == 'true'
        run: |
          # Python embeddable 是免安装的 Python,跟 vol3 wheel 配合
          # 让分析机不必预装 Python 也能跑 vol
          mkdir -p 02_analysis/python
          PY_VERSION="3.12.7"
          PY_URL="https://www.python.org/ftp/python/${PY_VERSION}/python-${PY_VERSION}-embed-amd64.zip"
          echo "Downloading Python ${PY_VERSION} embeddable..."
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/python-embed.zip "${PY_URL}"
          unzip -q -o /tmp/python-embed.zip -d 02_analysis/python
          rm -f /tmp/python-embed.zip
          # embeddable 默认禁 pip,改 _pth 文件启用 site
          PTH_FILE=$(ls 02_analysis/python/python*._pth 2>/dev/null | head -1)
          if [ -n "$PTH_FILE" ]; then
              echo "PTH file: $PTH_FILE"
              echo "--- Before ---"
              cat "$PTH_FILE"
              echo "---"
            # 直接重写整个 _pth 文件。python312.zip 是 Python 标准库，
            # site-packages 是下面离线展开的 Volatility 及依赖。
            printf '%s\n' "python312.zip" "." "site-packages" > "$PTH_FILE"
            echo "--- After rewrite ---"
            cat "$PTH_FILE"
            echo "---"
          else
              echo "ERROR: no _pth file found"
              ls 02_analysis/python/*.pth 2>&1 || true
              exit 1
          fi
          # Ubuntu runner 不能执行 Windows python.exe。直接把 Windows wheel
          # 展开到 site-packages，分析机启动时由 python312._pth 加载。
          SITE_PACKAGES="02_analysis/python/site-packages"
          mkdir -p "$SITE_PACKAGES"
          shopt -s nullglob
          wheels=(02_analysis/volatility3/*.whl)
          test "${#wheels[@]}" -gt 0
          for wheel in "${wheels[@]}"; do
              echo "Installing wheel contents: $wheel"
              unzip -q -o "$wheel" -d "$SITE_PACKAGES"
          done
          test -s 02_analysis/python/python312.zip
          unzip -l 02_analysis/python/python312.zip | grep -q 'encodings/__init__.py'
          test -f "$SITE_PACKAGES/volatility3/__init__.py"
          test -f "$SITE_PACKAGES/pefile.py"
          test -f 02_analysis/vol.py
          echo "✓ Python standard library and Volatility package staged"
          ls -la 02_analysis/python/ | head -20
          find "$SITE_PACKAGES" -maxdepth 1 -type d -print | sort

      - name: Generate checksums
        if: steps.check.outputs.changed == 'true'
        run: |
          {
            echo "# Forensics Tools SHA256"
            echo "# Generated: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "# WinPmem: ${{ steps.winpmem.outputs.tag }}"
            echo "# capa:    ${{ steps.capa.outputs.tag }}"
            echo ""
            find 01_collection 02_analysis -type f \( -name "*.exe" -o -name "capa*" \) -exec sha256sum {} \;
          } > SHA256SUMS
          cat SHA256SUMS

      - name: Build release notes
        if: steps.check.outputs.changed == 'true'
        run: |
          {
            echo "## 取证工具自动打包"
            echo ""
            echo "**WinPmem**: [${{ steps.winpmem.outputs.tag }}](https://github.com/Velocidex/WinPmem/releases/tag/${{ steps.winpmem.outputs.tag }})"
            echo "**capa**: [${{ steps.capa.outputs.tag }}](https://github.com/mandiant/capa/releases/tag/${{ steps.capa.outputs.tag }})"
            echo ""
            echo "### 包含文件"
            echo "- \`${{ steps.winpmem.outputs.asset }}\` - 官方签名的生产版内存采集器"
            echo "- \`capa.exe\` (含依赖) - PE 静态分析"
            echo ""
            echo "### 发布产物"
            echo "- 仅发布 \`ir-toolkit.zip\`；以上工具均已打包在 zip 内，不单独发布。"
            echo ""
            echo "### SHA256 校验"
            echo '```'
            cat SHA256SUMS
            echo '```'
            echo ""
            echo "### 自动触发"
            echo "此 release 由 GitHub Actions 自动生成,每周检查更新。"
            echo "手动触发: Actions → Fetch Forensics Tools → Run workflow"
          } > /tmp/release_notes.md
          cat /tmp/release_notes.md

      - name: Create tools release
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_TAG="tools-${{ steps.winpmem.outputs.tag }}-${{ steps.capa.outputs.tag }}"
          echo "Creating release: $NEW_TAG"

          # 强制清理所有已存在的 tools-* release(可能残留 Draft / 失败的)
          # 用 --jq 直接输出 string,避免 head -1 拿到 JSON 对象
          EXISTING=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[] | select(.tagName | startswith("tools-")) | .tagName' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            echo "$EXISTING" | while IFS= read -r old; do
              [ -z "$old" ] && continue
              echo "Deleting old release: $old"
              gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes 2>&1 || true
              # 单独删 git tag(因为 gh release delete 不带 --cleanup-tags)
              echo "Deleting old tag: $old"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$old" 2>&1 | head -1 || true
            done
          fi

          # 创建新 release
          gh release create "$NEW_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Forensics Tools - ${{ steps.winpmem.outputs.tag }} / ${{ steps.capa.outputs.tag }}" \
            --notes-file /tmp/release_notes.md

          echo "Release created: $NEW_TAG"
          echo "URL: https://github.com/$GITHUB_REPOSITORY/releases/tag/$NEW_TAG"

      - name: Build all-in-one zip
        if: steps.check.outputs.changed == 'true'
        run: |
          # 只发布一个 zip；工具二进制（包括 capa）必须进入 zip，不单独上传。
          test -s "01_collection/tools/${{ steps.winpmem.outputs.asset }}"
          CAPA_EXE=$(find 02_analysis/tools -type f -name "capa.exe" | head -1)
          test -n "$CAPA_EXE" && test -s "$CAPA_EXE"
          echo "Bundled tools: 01_collection/tools/${{ steps.winpmem.outputs.asset }}, $CAPA_EXE"

          # 整个目录打成一个 zip,排除构建目录；SHA256SUMS 保留在 zip 内。
          zip -r ir-toolkit.zip . \
            -x '.git/*' \
            -x '.github/*' \
            -x '.gitkeep' \
            -x '.gitignore' \
            -x 'ir-toolkit.zip' \
            -x 'tools-manifest.json' \
            -x 'install_tools.ps1' \
            -x 'install_tools.sh'
          unzip -l ir-toolkit.zip | grep -q "01_collection/tools/${{ steps.winpmem.outputs.asset }}"
          unzip -l ir-toolkit.zip | grep -q 'capa.exe'
          ls -la ir-toolkit.zip
          echo "✓ Built all-in-one zip"

      - name: Attach all-in-one zip to release
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_TAG="tools-${{ steps.winpmem.outputs.tag }}-${{ steps.capa.outputs.tag }}"
          gh release upload "$NEW_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            ir-toolkit.zip
          echo "✓ All-in-one zip attached: ir-toolkit.zip"
          echo ""
          echo "Release assets:"
          gh release view "$NEW_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "  - \(.name) (\(.size / 1048576 | floor)MB)"'

      - name: Summary
        if: always()
        run: |
          echo "## 🔧 Forensics Tools Update" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 工具 | 版本 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| WinPmem | ${{ steps.winpmem.outputs.tag }} | ${{ steps.check.outputs.changed == 'true' && '📥 updated' || '✓ no change' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| capa | ${{ steps.capa.outputs.tag }} | ${{ steps.check.outputs.changed == 'true' && '📥 updated' || '✓ no change' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check.outputs.changed }}" = "true" ]; then
            echo "📦 [下载完整包 (ir-toolkit.zip)](https://github.com/${{ github.repository }}/releases/latest)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**一个 zip,直接用**: 解压 → 拷 U 盘 → 管理员运行 01_collection/run_collect.bat" >> $GITHUB_STEP_SUMMARY
          fi
