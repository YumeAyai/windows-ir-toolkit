name: Fetch Forensics Tools

on:
  # 每周日 02:00 UTC 自动检查更新 (北京时间 10:00)
  schedule:
    - cron: '0 2 * * 0'
  # 支持手动触发
  workflow_dispatch:
    inputs:
      force:
        description: '强制更新(即使没新版本也重新打包)'
        required: false
        default: 'false'
        type: boolean
  # 当 fetch-tools 相关文件变更时也触发
  push:
    paths:
      - '.github/workflows/fetch-tools.yml'
      - 'tools-manifest.json'

permissions:
  contents: write   # 用来创建 release
  actions: read

jobs:
  fetch:
    name: Download tools & publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python (用于解析 JSON)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Load manifest
        id: manifest
        run: |
          python3 -c "import json; m = json.load(open('tools-manifest.json')); print(json.dumps(m, indent=2))"
          echo "manifest<<EOF" >> $GITHUB_OUTPUT
          cat tools-manifest.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Resolve latest WinPmem
        id: winpmem
        run: |
          echo "Querying Velocidex/WinPmem latest release..."
          WINPMEM_JSON=$(curl -fsSL "https://api.github.com/repos/Velocidex/WinPmem/releases/latest")
          WINPMEM_TAG=$(echo "$WINPMEM_JSON" | jq -r '.tag_name // empty')
          WINPMEM_URL=$(echo "$WINPMEM_JSON" | jq -r '.assets[] | select(.name == "winpmem_mini_x64_rc2.exe") | .browser_download_url' 2>/dev/null)
          echo "DEBUG: WINPMEM_URL='$WINPMEM_URL' (len=${#WINPMEM_URL})"
          if [ -z "$WINPMEM_URL" ] || [ "$WINPMEM_URL" = "null" ]; then
            echo "::error::Cannot find winpmem_mini_x64_rc2.exe in latest release"
            echo "DEBUG: First 800 chars of API response:"
            echo "$WINPMEM_JSON" | head -c 800
            echo ""
            echo "DEBUG: Available assets:"
            echo "$WINPMEM_JSON" | jq -r '.assets[].name // empty' 2>/dev/null || echo "(no assets array)"
            exit 1
          fi
          echo "tag=$WINPMEM_TAG" >> $GITHUB_OUTPUT
          echo "url=$WINPMEM_URL" >> $GITHUB_OUTPUT
          echo "✓ WinPmem $WINPMEM_TAG"

      - name: Resolve latest capa
        id: capa
        run: |
          echo "Querying mandiant/capa latest release..."
          CAPA_JSON=$(curl -fsSL "https://api.github.com/repos/mandiant/capa/releases/latest")
          CAPA_TAG=$(echo "$CAPA_JSON" | jq -r '.tag_name // empty')
          CAPA_URL=$(echo "$CAPA_JSON" | jq -r --arg tag "$CAPA_TAG" '
            (.assets[] | select(.name == ("capa-\($tag)-windows.zip")) | .browser_download_url) //
            (.assets[] | select((.name | test("windows"; "i")) and (.name | test("\\.zip$"))) | .browser_download_url)
          ' 2>/dev/null)
          echo "DEBUG: CAPA_URL='$CAPA_URL' (len=${#CAPA_URL})"
          if [ -z "$CAPA_URL" ] || [ "$CAPA_URL" = "null" ]; then
            echo "::error::Cannot find capa windows zip in latest release"
            echo "DEBUG: First 800 chars of API response:"
            echo "$CAPA_JSON" | head -c 800
            echo ""
            echo "DEBUG: Available assets:"
            echo "$CAPA_JSON" | jq -r '.assets[].name // empty' 2>/dev/null || echo "(no assets array)"
            exit 1
          fi
          echo "tag=$CAPA_TAG" >> $GITHUB_OUTPUT
          echo "url=$CAPA_URL" >> $GITHUB_OUTPUT
          echo "✓ capa $CAPA_TAG"

      - name: Check existing release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 看现有的 tools-* release
          EXISTING_TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[] | select(.tagName | startswith("tools-"))' 2>/dev/null | head -1 || echo "")
          echo "existing_tag=$EXISTING_TAG" >> $GITHUB_OUTPUT

          # 对比 winpmem tag 是否变化
          if [ -n "$EXISTING_TAG" ] && [ "$EXISTING_TAG" = "tools-${{ steps.winpmem.outputs.tag }}-${{ steps.capa.outputs.tag }}" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "✓ No changes, existing release matches: $EXISTING_TAG"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "→ Changes detected, will publish new release"
          fi

      - name: Download WinPmem
        if: steps.check.outputs.changed == 'true'
        run: |
          mkdir -p 01_acquire
          echo "Downloading ${{ steps.winpmem.outputs.url }}..."
          curl -fsSL --retry 3 --retry-delay 5 -o 01_acquire/winpmem_mini_x64_rc2.exe "${{ steps.winpmem.outputs.url }}"
          ls -la 01_acquire/
          file 01_acquire/winpmem_mini_x64_rc2.exe 2>/dev/null || true

      - name: Download capa
        if: steps.check.outputs.changed == 'true'
        run: |
          mkdir -p 03_analysis
          echo "Downloading ${{ steps.capa.outputs.url }}..."
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/capa.zip "${{ steps.capa.outputs.url }}"
          # 展开 zip,但只保留 windows-x64 的可执行文件
          cd 03_analysis
          unzip -o /tmp/capa.zip
          rm -f /tmp/capa.zip
          # 找到主程序,简化命名
          find . -name "capa.exe" -type f | head -1
          ls -la

      - name: Download Sysmon
        if: steps.check.outputs.changed == 'true'
        run: |
          # Sysmon 不是 GitHub release,直接 curl
          mkdir -p 01_acquire/sysmon
          echo "Downloading Sysmon from Microsoft..."
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/Sysmon.zip "https://download.sysinternals.com/files/Sysmon.zip"
          cd 01_acquire/sysmon
          unzip -o /tmp/Sysmon.zip
          rm -f /tmp/Sysmon.zip
          # 保留 Sysmon64.exe (主程序) 和 Eula.txt
          ls -la

      - name: Download Volatility 3
        if: steps.check.outputs.changed == 'true'
        run: |
          # vol3 是 Python 包,用 pip download 下成 .whl 塞进 zip
          mkdir -p 03_analysis/volatility3
          echo "Downloading Volatility 3 wheel via pip..."
          pip3 download --dest 03_analysis/volatility3 volatility3 2>&1 | tail -10
          # 也下 symbols pack(常用 windows PDB)
          echo "Downloading Volatility 3 symbols pack (optional)..."
          mkdir -p 03_analysis/volatility3/symbols
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/symbols.zip "https://downloads.volatilityfoundation.org/volatility3/symbols/windows.zip" || echo "  (symbols download failed, ok - download_symbols.ps1 will handle later)"
          if [ -f /tmp/symbols.zip ]; then
              cd 03_analysis/volatility3/symbols
              unzip -o /tmp/symbols.zip 2>/dev/null || true
              rm -f /tmp/symbols.zip
          fi
          ls -la 03_analysis/volatility3/

      - name: Download Python embeddable (Windows)
        if: steps.check.outputs.changed == 'true'
        run: |
          # Python embeddable 是免安装的 Python,跟 vol3 wheel 配合
          # 让分析机不必预装 Python 也能跑 vol
          mkdir -p 03_analysis/python
          PY_VERSION="3.12.7"
          PY_URL="https://www.python.org/ftp/python/${PY_VERSION}/python-${PY_VERSION}-embed-amd64.zip"
          echo "Downloading Python ${PY_VERSION} embeddable..."
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/python-embed.zip "${PY_URL}"
          unzip -q -o /tmp/python-embed.zip -d 03_analysis/python
          rm -f /tmp/python-embed.zip
          # embeddable 默认禁 pip,改 _pth 文件启用 site
          PTH_FILE=$(ls 03_analysis/python/python*._pth 2>/dev/null | head -1)
          if [ -n "$PTH_FILE" ]; then
              # 取消 import site 注释 + 加 Lib/site-packages
              sed -i 's/^#importsite/importsite/' "$PTH_FILE"
              echo "Lib\site-packages" >> "$PTH_FILE"
              echo "✓ Enabled pip in Python embeddable"
          fi
          # 下 pip(embeddable 不带 pip)
          curl -fsSL https://bootstrap.pypa.io/get-pip.py -o /tmp/get-pip.py
          03_analysis/python/python.exe /tmp/get-pip.py --no-warn-script-location 2>&1 | tail -3
          rm -f /tmp/get-pip.py
          # 用 embeddable python 装 vol3
          echo "Installing Volatility 3 into Python embeddable..."
          WHL=$(ls 03_analysis/volatility3/volatility3-*.whl | head -1)
          if [ -n "$WHL" ]; then
              03_analysis/python/python.exe -m pip install --no-warn-script-location "$WHL" 2>&1 | tail -3
              echo "✓ Volatility 3 installed"
              # 验证
              03_analysis/python/python.exe -m volatility3 --help 2>&1 | head -3
          fi
          ls -la 03_analysis/python/ | head -20

      - name: Generate checksums
        if: steps.check.outputs.changed == 'true'
        run: |
          {
            echo "# Forensics Tools SHA256"
            echo "# Generated: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "# WinPmem: ${{ steps.winpmem.outputs.tag }}"
            echo "# capa:    ${{ steps.capa.outputs.tag }}"
            echo ""
            find 01_acquire 03_analysis -type f \( -name "*.exe" -o -name "capa*" \) -exec sha256sum {} \;
          } > SHA256SUMS
          cat SHA256SUMS

      - name: Build release notes
        if: steps.check.outputs.changed == 'true'
        run: |
          {
            echo "## 取证工具自动打包"
            echo ""
            echo "**WinPmem**: [${{ steps.winpmem.outputs.tag }}](https://github.com/Velocidex/WinPmem/releases/tag/${{ steps.winpmem.outputs.tag }})"
            echo "**capa**: [${{ steps.capa.outputs.tag }}](https://github.com/mandiant/capa/releases/tag/${{ steps.capa.outputs.tag }})"
            echo ""
            echo "### 包含文件"
            echo "- \`winpmem_mini_x64_rc2.exe\` - 内存 dump 主力 (~5MB)"
            echo "- \`capa.exe\` (含依赖) - PE 静态分析"
            echo ""
            echo "### SHA256 校验"
            echo '```'
            cat SHA256SUMS
            echo '```'
            echo ""
            echo "### 自动触发"
            echo "此 release 由 GitHub Actions 自动生成,每周检查更新。"
            echo "手动触发: Actions → Fetch Forensics Tools → Run workflow"
          } > /tmp/release_notes.md
          cat /tmp/release_notes.md

      - name: Create tools release
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_TAG="tools-${{ steps.winpmem.outputs.tag }}-${{ steps.capa.outputs.tag }}"
          echo "Creating release: $NEW_TAG"

          # 强制清理所有已存在的 tools-* release(可能残留 Draft / 失败的)
          # 用 --jq 直接输出 string,避免 head -1 拿到 JSON 对象
          EXISTING=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[] | select(.tagName | startswith("tools-")) | .tagName' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            echo "$EXISTING" | while IFS= read -r old; do
              [ -z "$old" ] && continue
              echo "Deleting old release: $old"
              gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes 2>&1 || true
              # 单独删 git tag(因为 gh release delete 不带 --cleanup-tags)
              echo "Deleting old tag: $old"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$old" 2>&1 | head -1 || true
            done
          fi

          # 创建新 release
          gh release create "$NEW_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Forensics Tools - ${{ steps.winpmem.outputs.tag }} / ${{ steps.capa.outputs.tag }}" \
            --notes-file /tmp/release_notes.md

          # 上传单文件 assets
          gh release upload "$NEW_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            01_acquire/winpmem_mini_x64_rc2.exe \
            SHA256SUMS 2>/dev/null || true

          if [ -d "03_analysis" ]; then
            find 03_analysis -type f -name "capa.exe" -exec gh release upload "$NEW_TAG" {} --repo "$GITHUB_REPOSITORY" --clobber \; 2>/dev/null || true
          fi

          echo "Release created: $NEW_TAG"
          echo "URL: https://github.com/$GITHUB_REPOSITORY/releases/tag/$NEW_TAG"

      - name: Build all-in-one zip
        if: steps.check.outputs.changed == 'true'
        run: |
          # 整个目录打成一个 zip,排除元数据/构建产物
          zip -r ir-toolkit.zip . \
            -x '.git/*' \
            -x '.github/*' \
            -x '.gitkeep' \
            -x '.gitignore' \
            -x 'SHA256SUMS' \
            -x 'ir-toolkit.zip' \
            -x 'tools-manifest.json' \
            -x 'install_tools.ps1' \
            -x 'install_tools.sh' \
            -x '*.zip'
          ls -la ir-toolkit.zip
          echo "✓ Built all-in-one zip"

      - name: Attach all-in-one zip to release
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_TAG="tools-${{ steps.winpmem.outputs.tag }}-${{ steps.capa.outputs.tag }}"
          gh release upload "$NEW_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            ir-toolkit.zip
          echo "✓ All-in-one zip attached: ir-toolkit.zip"
          echo ""
          echo "Release assets:"
          gh release view "$NEW_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "  - \(.name) (\(.size / 1048576 | floor)MB)"'

      - name: Summary
        if: always()
        run: |
          echo "## 🔧 Forensics Tools Update" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 工具 | 版本 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| WinPmem | ${{ steps.winpmem.outputs.tag }} | ${{ steps.check.outputs.changed == 'true' && '📥 updated' || '✓ no change' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| capa | ${{ steps.capa.outputs.tag }} | ${{ steps.check.outputs.changed == 'true' && '📥 updated' || '✓ no change' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check.outputs.changed }}" = "true" ]; then
            echo "📦 [下载完整包 (ir-toolkit.zip)](https://github.com/${{ github.repository }}/releases/latest)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**一个 zip,直接用**: 解压 → 拷 U 盘 → 管理员双击 02_collection/acquire.bat" >> $GITHUB_STEP_SUMMARY
          fi
